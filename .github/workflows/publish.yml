name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Pack, Publish & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.x
            8.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Test (with coverage)
        run: dotnet test --no-build --configuration Release

      # ─── NuGet ────────────────────────────────────────────────────────────

      - name: Pack NuGet packages
        run: |
          dotnet pack src/Lolzteam.Api \
            --no-build --configuration Release \
            --output dist/nupkg
          dotnet pack src/Lolzteam.Api.DependencyInjection \
            --no-build --configuration Release \
            --output dist/nupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "dist/nupkg/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # ─── Zip archives per TFM ─────────────────────────────────────────────

      - name: Create per-TFM zip archives
        run: |
          VERSION="${GITHUB_REF_NAME}"   # e.g. v1.2.3

          for tfm in netstandard2.0 netstandard2.1 net6.0 net8.0; do
            staging="dist/zip/${tfm}"
            mkdir -p "${staging}"

            # Core library
            src_api="src/Lolzteam.Api/bin/Release/${tfm}"
            cp "${src_api}/Lolzteam.Api.dll"  "${staging}/" 2>/dev/null || true
            cp "${src_api}/Lolzteam.Api.xml"  "${staging}/" 2>/dev/null || true
            cp "${src_api}/Lolzteam.Api.pdb"  "${staging}/" 2>/dev/null || true

            # DI package
            src_di="src/Lolzteam.Api.DependencyInjection/bin/Release/${tfm}"
            cp "${src_di}/Lolzteam.Api.DependencyInjection.dll" "${staging}/" 2>/dev/null || true
            cp "${src_di}/Lolzteam.Api.DependencyInjection.xml" "${staging}/" 2>/dev/null || true
            cp "${src_di}/Lolzteam.Api.DependencyInjection.pdb" "${staging}/" 2>/dev/null || true

            archive="lolzteam-api-${VERSION}-${tfm}.zip"
            (cd "${staging}" && zip -r "../../${archive}" .)
            echo "Created dist/${archive}"
          done

      # ─── GitHub Release ───────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nupkg/*.nupkg
            dist/nupkg/*.snupkg
            dist/lolzteam-api-*.zip
